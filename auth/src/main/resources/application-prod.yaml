server:
  port: ${SERVER_PORT}

spring:
  application:
    name: auth

  datasource:
    hikari:
      connection-timeout: 30000
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?currentSchema=${DB_SCHEMA:auth}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:auth}
        format_sql: false

app:
  bootstrap:
    admin:
      username: ${ADMIN_USER}
      password: ${ADMIN_PASSWORD}

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN
    root: INFO

jwt:
  secret: ${JWT_SECRET}
