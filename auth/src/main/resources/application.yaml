server:
  port: 8081

spring:
  application:
    name: auth

  datasource:
    url: jdbc:mariadb://localhost:3306/e2d_auth_server
    username: root
    password: 1234
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        type:
          uuid:
            char: true
        format_sql: true

app:
  bootstrap:
    admin:
      username: admin
      password: admin123

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
