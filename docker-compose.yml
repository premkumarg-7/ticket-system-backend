services:
  postgres:
    image: postgres:16-alpine
    container_name: ticket_system_db
    environment:
      POSTGRES_DB: ${DB_NAME:-ticket_system}
      POSTGRES_USER: ${DB_USER:-ticket_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-1234}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ticket_system_db:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ticket_user} -d ${DB_NAME:-ticket_system}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ticket-net]

  kafka:
    image: apache/kafka:3.9.0
    container_name: ticket_system_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [ticket-net]

  auth:
    build:
      context: ./auth
    container_name: ticket_system_auth
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-dev}
      SERVER_PORT: 8081
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ticket_system}
      DB_SCHEMA: auth
      DB_USER: ${DB_USER:-ticket_user}
      DB_PASSWORD: ${DB_PASSWORD:-1234}
      JWT_SECRET: ${JWT_SECRET:-e2d-helpdesk-service-2026-supersecret-key}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    ports:
      - "8081:8081"
    networks: [ticket-net]

  ticket:
    build:
      context: ./ticketService
    container_name: ticket_system_ticket
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-dev}
      SERVER_PORT: 8088
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ticket_system}
      DB_SCHEMA: ticket
      DB_USER: ${DB_USER:-ticket_user}
      DB_PASSWORD: ${DB_PASSWORD:-1234}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AUTH_SERVICE_URL: http://auth:8081
    ports:
      - "8088:8088"
    networks: [ticket-net]

  notification:
    build:
      context: ./notification-service
    container_name: ticket_system_notification
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-dev}
      SERVER_PORT: 9000
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MAIL_USERNAME: ${MAIL_USERNAME:-1eventxtest@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-ddgx twcr pdjy pkam}
    ports:
      - "9000:9000"
    networks: [ticket-net]

  gateway:
    build:
      context: ./gateway
    container_name: ticket_system_gateway
    depends_on:
      - auth
      - ticket
      - notification
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-dev}
      GATEWAY_PORT: 8001
      AUTH_SERVICE_URL: http://auth:8081
      TICKET_SERVICE_URL: http://ticket:8088
      NOTIFICATION_SERVICE_URL: http://notification:9000
      JWT_SECRET: ${JWT_SECRET:-e2d-helpdesk-service-2026-supersecret-key}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "8001:8001"
    networks: [ticket-net]

networks:
  ticket-net:
    driver: bridge

volumes:
  ticket_system_db:
