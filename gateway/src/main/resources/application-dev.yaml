server:
  port: ${GATEWAY_PORT:8001}

spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - RemoveRequestHeader=Cookie

          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=0

            - id: admin-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/admin/**
              filters:
                - StripPrefix=0
                - JwtAuthFilter

            - id: ticket-service
              uri: ${TICKET_SERVICE_URL:http://localhost:8088}
              predicates:
                - Path=/api/ticket/**
              filters:
                - StripPrefix=0
                - JwtAuthFilter

            - id: openapi-auth
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/v3/api-docs/auth
              filters:
                - SetPath=/v3/api-docs

            - id: openapi-ticket
              uri: ${TICKET_SERVICE_URL:http://localhost:8088}
              predicates:
                - Path=/v3/api-docs/ticket
              filters:
                - SetPath=/v3/api-docs

            - id: openapi-notification
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:9000}
              predicates:
                - Path=/v3/api-docs/notification
              filters:
                - SetPath=/v3/api-docs

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: auth
        url: /v3/api-docs/auth
      - name: ticket
        url: /v3/api-docs/ticket
      - name: notification
        url: /v3/api-docs/notification

jwt:
  secret: ${JWT_SECRET:e2d-helpdesk-service-2026-supersecret-key}