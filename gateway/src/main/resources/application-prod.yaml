server:
  port: ${GATEWAY_PORT}

spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - RemoveRequestHeader=Cookie

          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL}
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=0

            - id: admin-service
              uri: ${AUTH_SERVICE_URL}
              predicates:
                - Path=/admin/**
              filters:
                - StripPrefix=0
                - JwtAuthFilter

            - id: ticket-service
              uri: ${TICKET_SERVICE_URL}
              predicates:
                - Path=/api/ticket/**
              filters:
                - StripPrefix=0
                - JwtAuthFilter

jwt:
  secret: ${JWT_SECRET}
