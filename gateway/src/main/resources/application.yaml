server:
  port: 8001

spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - RemoveRequestHeader=Cookie

          routes:
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=0

            - id: admin-service
              uri: http://localhost:8081
              predicates:
                - Path=/admin/**
              filters:
                - StripPrefix=0
                - JwtAuthFilter

            - id: ticket-service
              uri: http://localhost:8088
              predicates:
                - Path=/api/ticket/**
              filters:
                - StripPrefix=0
                - JwtAuthFilter

jwt:
  secret: ${JWT_SECRET:e2d-helpdesk-service-2026-supersecret-key}
