server:
  port: ${GATEWAY_PORT:8001}

spring:
  application:
    name: gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

      server:
        webflux:
          default-filters:
            - RemoveRequestHeader=Cookie

          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=0

            - id: admin-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/admin/**
              filters:
                - StripPrefix=0
                - JwtAuthFilter

            - id: ticket-service
              uri: ${TICKET_SERVICE_URL:http://localhost:8088}
              predicates:
                - Path=/api/ticket/**
              filters:
                - StripPrefix=0
                - JwtAuthFilter

jwt:
  secret: ${JWT_SECRET:e2d-helpdesk-service-2026-supersecret-key}
