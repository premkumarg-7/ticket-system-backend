server:
  port: ${SERVER_PORT:8088}

spring:
  application:
    name: ticketService

  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:e2d_ticket_server}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        type:
          uuid:
            char: true
        format_sql: true

logging:
  level:
    org.hibernate.SQL: DEBUG
